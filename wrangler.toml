# =============================================================================
# wrangler.toml — Cloudflare Pages + Worker configuration for SBBL-HQ
# SECURITY: No secrets here. All secrets are injected via wrangler secret put
# or via the Cloudflare Pages dashboard environment variables.
# =============================================================================

name = "sbbl-hq"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Pages project configuration
# ---------------------------------------------------------------------------
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Static asset binding (served from dist/ after Vite build)
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Production environment — secrets injected via Cloudflare dashboard / CI
# ---------------------------------------------------------------------------
[env.production]
name = "sbbl-hq"

# ---------------------------------------------------------------------------
# Staging environment
# ---------------------------------------------------------------------------
[env.staging]
name = "sbbl-hq-staging"

# ---------------------------------------------------------------------------
# Local development overrides (populated from .dev.vars — never committed)
# ---------------------------------------------------------------------------
# [vars]  ← do NOT add secrets here; use .dev.vars locally and
#            `wrangler secret put` / Pages dashboard for production.

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------
[build]
command = "npm run build"

# ---------------------------------------------------------------------------
# Observability — enable for production diagnostics
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 0.1  # 10% of requests sampled to Cloudflare Logpush
