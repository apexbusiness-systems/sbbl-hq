name: Stream Validation Prelive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/stream/**'
      - 'src/test/stream/**'
      - 'e2e/stream-validation.spec.ts'
      - 'ops/validation/**'
      - 'supabase/migrations/20260410120000_stream_validation_system.sql'
      - 'STREAM_TEST_STRATEGY.md'
      - 'STREAM_VALIDATION_MATRIX.md'
      - 'PAYWALL_ENFORCEMENT_POLICY.md'
      - 'ONE_DEVICE_POLICY.md'
      - 'RESUME_POLICY.md'
      - 'STREAM_RISK_MODEL.md'
      - 'PRELIVE_GO_LIVE_CHECKLIST.md'

jobs:
  validate-prelive:
    name: validate:prelive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'REDACTED' }}
      VALIDATION_SOURCE_CLASSIFICATION: sandbox
      VALIDATION_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validate:prelive gate
        run: node ops/validation/stream-validation.mjs prelive

      - name: Upload stream-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-validation-artifacts
          path: |
            validation-report.json
            verification-matrix.md
            performance-summary.json
            audit-summary.json
            artifacts/stream-validation/**
