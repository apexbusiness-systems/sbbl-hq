name: Stream Validation Prelive

on:
  workflow_dispatch:

jobs:
  validate-prelive:
    name: validate:prelive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'REDACTED' }}
      VALIDATION_SOURCE_CLASSIFICATION: sandbox
      VALIDATION_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run validate:prelive gate
        run: node ops/validation/stream-validation.mjs prelive

      - name: Upload stream-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-validation-artifacts
          path: |
            validation-report.json
            verification-matrix.md
            performance-summary.json
            audit-summary.json
            artifacts/stream-validation/**
