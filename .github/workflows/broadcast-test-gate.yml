name: Broadcast Test Gate

on:
  pull_request:
    paths:
      - 'src/worker/index.ts'
      - 'src/pages/Live.tsx'
      - 'src/components/LiveStreamPlayer.tsx'
      - 'src/hooks/useLiveAccess.ts'
      - 'src/lib/stream/**'
      - 'src/lib/constants/**'
      - 'supabase/migrations/**'
      - 'src/test/broadcast-*.test.ts'
      - 'tests/e2e/broadcast-live-e2e.spec.ts'
      - 'tests/e2e/broadcast-paywall-evidence.spec.ts'
      - '.github/workflows/broadcast-evidence.yml'
  workflow_dispatch:

concurrency:
  group: broadcast-test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
      VITE_DEFAULT_LEAGUE: SBBL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Install Playwright Linux dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run broadcast E2E
        run: npx playwright test tests/e2e/broadcast-live-e2e.spec.ts tests/e2e/broadcast-paywall-evidence.spec.ts --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
