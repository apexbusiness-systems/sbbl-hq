name: Build Chaos Battery

on:
  pull_request:
    paths:
      - 'src/lib/api/**'
      - 'src/lib/supabase/**'
      - 'src/pages/**'
      - 'src/contexts/**'
      - 'src/test/**'
      - 'e2e/**'
      - 'playwright-fixture.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/build-chaos-battery.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: Full Build Chaos Battery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YW5pbHh5Z25wdWN3a3dwc29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI5OTIsImV4cCI6MjA5MDE5ODk5Mn0.kLbwopHDqf33H9flwIbO5XqfPYdi0wMqjeVJC76-Ceo' }}
      VITE_APP_NAME: SBBL HQ
      VITE_DEFAULT_LEAGUE: SBBL

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit chaos battery
        run: npx vitest run src/test/apifetch-401-retry.test.ts src/test/stream-chaos-battery.test.ts src/test/ops-chaos-battery.test.ts src/test/runtime-config.test.ts src/test/ops-auth-gating.test.tsx

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E chaos battery
        run: npx playwright test e2e/build-chaos-battery.spec.ts e2e/ops-auth-ingest-harmony.spec.ts e2e/critical-paths.spec.ts
