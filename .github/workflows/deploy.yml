name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YW5pbHh5Z25wdWN3a3dwc29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI5OTIsImV4cCI6MjA5MDE5ODk5Mn0.kLbwopHDqf33H9flwIbO5XqfPYdi0wMqjeVJC76-Ceo' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAACz241-XHmFaqRrM' }}
          VITE_APP_NAME: SBBL HQ
          VITE_DEFAULT_LEAGUE: SBBL

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy live health gate (must have server secrets)
        shell: bash
        run: |
          set -euo pipefail

          # Allow edge propagation before probing live endpoints.
          sleep 15

          HEALTH_URL="https://sbbl-hq.icu/ops/health"
          TEAMS_URL="https://sbbl-hq.icu/api/teams?leagueId=wbl"
          SCORES_URL="https://sbbl-hq.icu/api/scores?league=wbl"

          health_json="$(curl -fsS "$HEALTH_URL")"
          echo "$health_json"

          # Hard-fail deploy if worker reports missing required env secrets.
          if echo "$health_json" | grep -q '"ok":false'; then
            echo "❌ /ops/health returned not-ok after deploy"
            exit 1
          fi

          # Data tabs depend on these APIs; require HTTP 200 after deploy.
          teams_code="$(curl -sS -o /tmp/teams.json -w '%{http_code}' "$TEAMS_URL")"
          scores_code="$(curl -sS -o /tmp/scores.json -w '%{http_code}' "$SCORES_URL")"
          echo "teams_status=$teams_code"
          echo "scores_status=$scores_code"
          head -c 200 /tmp/teams.json || true; echo
          head -c 200 /tmp/scores.json || true; echo

          test "$teams_code" = "200"
          test "$scores_code" = "200"
