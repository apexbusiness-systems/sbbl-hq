name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Allow either Vite-prefixed or legacy Supabase secret names.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YW5pbHh5Z25wdWN3a3dwc29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI5OTIsImV4cCI6MjA5MDE5ODk5Mn0.kLbwopHDqf33H9flwIbO5XqfPYdi0wMqjeVJC76-Ceo' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAACz241-XHmFaqRrM' }}
          VITE_APP_NAME: SBBL HQ
          VITE_DEFAULT_LEAGUE: SBBL

      - name: Generate Pre-Live Evidence
        run: python update_livestream.py

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.deploy.jsonc
        env:
          # Prefer the Workers-scoped token when available; fall back to
          # CLOUDFLARE_API_TOKEN for backwards compatibility.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push runtime secrets to Cloudflare Worker
        # wrangler deploy only ships code — secrets are NOT auto-synced from
        # GitHub Actions env vars. Each secret must be explicitly pushed via
        # `wrangler secret put` so the live Worker can read them via env.*.
        #
        # Guardrails:
        # 1) Required secrets fail the deploy when absent.
        # 2) Optional secrets are skipped when empty (never push empty strings),
        #    which prevents server env validation from failing globally.
        run: |
          set -euo pipefail
          WRANGLER_WORKER_NAME="sbbl-hq-worker"
          WRANGLER_ENV_TARGET="${CLOUDFLARE_DEPLOY_ENV:-}"
          WRANGLER_CONFIG_FILE="wrangler.deploy.jsonc"

          put_secret_value() {
            local name="$1"
            local value="$2"
            local -a env_args=()
            if [ -n "$WRANGLER_ENV_TARGET" ]; then
              env_args=(--env "$WRANGLER_ENV_TARGET")
            fi

            # Versions-aware secret writes are required when Workers Versions
            # is enabled; this avoids "latest version not deployed" failures.
            printf '%s' "$value" | npx wrangler versions secret put "$name" \
              --name "$WRANGLER_WORKER_NAME" \
              --config "$WRANGLER_CONFIG_FILE" \
              "${env_args[@]}" >/dev/null
          }

          put_required_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "❌ Missing required GitHub secret: $name"
              exit 1
            fi
            put_secret_value "$name" "$value"
            echo "✅ Synced required secret: $name"
          }

          put_optional_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "ℹ️ Skipping optional secret (empty): $name"
              return 0
            fi
            put_secret_value "$name" "$value"
            echo "✅ Synced optional secret: $name"
          }

          put_required_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"

          put_optional_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          put_optional_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          put_optional_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_optional_secret OMNIHUB_SYNC_URL "$OMNIHUB_SYNC_URL"
          put_optional_secret OMNIHUB_SIGNING_SECRET "$OMNIHUB_SIGNING_SECRET"
          put_optional_secret OMNIHUB_VERIFY_KEY "$OMNIHUB_VERIFY_KEY"
          put_optional_secret GROQ_API_KEY "$GROQ_API_KEY"
          put_optional_secret OPTIONAL_TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_ENV: ${{ vars.CLOUDFLARE_DEPLOY_ENV || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OMNIHUB_SYNC_URL: ${{ secrets.OMNIHUB_SYNC_URL }}
          OMNIHUB_SIGNING_SECRET: ${{ secrets.OMNIHUB_SIGNING_SECRET }}
          OMNIHUB_VERIFY_KEY: ${{ secrets.OMNIHUB_VERIFY_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.VITE_TURNSTILE_SECRET_KEY }}

      - name: Post-deploy health gate
        # Probes /ops/health on the live custom domain.
        # continue-on-error: true — the deploy itself already succeeded;
        # a transient health-check failure (CF propagation lag, BM challenge,
        # secret rotation window) must never mark a successful deploy as red.
        # The response body + HTTP status are always printed so on-call can
        # diagnose without re-running the workflow.
        continue-on-error: true
        run: |
          HEALTH_URL="https://sbbl-hq.icu/ops/health"
          UA="sbbl-deploy-health/1.0 (+https://github.com/$GITHUB_REPOSITORY)"

          # Give Cloudflare ~20s to propagate the new worker version globally
          # before the first probe. Without this, the first 1-2 attempts hit
          # the old version which may not yet have the updated secrets.
          echo "⏳ Waiting 20s for CF propagation before first probe..."
          sleep 20

          for attempt in {1..8}; do
            echo "--- Health check attempt $attempt / 8 ---"

            # Capture both status code and body separately for diagnostics.
            http_status=$(curl -s -o /tmp/health_body.json -w "%{http_code}" \
              --max-time 15 -A "$UA" "$HEALTH_URL" || echo "000")
            body=$(cat /tmp/health_body.json 2>/dev/null || echo "")

            echo "HTTP $http_status | body: $body"

            if [ "$http_status" = "200" ] && echo "$body" | jq -e '.ok == true and .db_ok == true' > /dev/null 2>&1; then
              echo "✅ Health check passed (HTTP 200, ok=true, db_ok=true)"
              exit 0
            fi

            # Diagnose common failures so on-call doesn't have to guess.
            if [ "$http_status" = "403" ]; then
              echo "⚠️  CF Bot Management blocked the probe (HTTP 403). Add a BM allow rule for UA: sbbl-deploy-health/"
            elif [ "$http_status" = "000" ]; then
              echo "⚠️  curl timed out or connection refused — CF may still be propagating"
            elif echo "$body" | jq -e '.db_ok == false' > /dev/null 2>&1; then
              echo "⚠️  Worker reachable but DB connection failed — check SUPABASE_SERVICE_ROLE_KEY secret"
            fi

            echo "↩️  Retrying in 15s..."
            sleep 15
          done

          echo "🚨 Health check did not pass after 8 attempts — deploy succeeded but DB connectivity should be investigated"
          exit 1
