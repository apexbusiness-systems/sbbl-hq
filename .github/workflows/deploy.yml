name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YW5pbHh5Z25wdWN3a3dwc29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI5OTIsImV4cCI6MjA5MDE5ODk5Mn0.kLbwopHDqf33H9flwIbO5XqfPYdi0wMqjeVJC76-Ceo' }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAACz241-XHmFaqRrM' }}
          VITE_APP_NAME: SBBL HQ
          VITE_DEFAULT_LEAGUE: SBBL

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy live health gate (must have server secrets)
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://sbbl-hq.icu/ops/health"
          TEAMS_URL="https://sbbl-hq.icu/api/teams?leagueId=wbl"
          SCORES_URL="https://sbbl-hq.icu/api/scores?league=wbl"

          check_api_200() {
            local label="$1"
            local url="$2"
            local body_file="$3"
            local code

            code="$(curl -sS -o "$body_file" -w '%{http_code}' "$url")"
            echo "${label}_status=$code"

            if [ "$code" != "200" ]; then
              echo "❌ ${label} endpoint returned HTTP $code"
              head -c 300 "$body_file" || true
              echo
              exit 1
            fi
          }

          # Retry health for up to 2 minutes to handle edge propagation delays.
          health_ok=false
          for attempt in {1..12}; do
            health_json="$(curl -fsS "$HEALTH_URL")"
            echo "health_attempt_${attempt}: $health_json"

            if echo "$health_json" | jq -e '.ok == true' >/dev/null; then
              health_ok=true
              break
            fi

            sleep 10
          done

          if [ "$health_ok" != "true" ]; then
            echo "❌ /ops/health did not become ok within retry window"
            exit 1
          fi

          # Data tabs depend on these APIs; require HTTP 200 after deploy.
          check_api_200 "teams" "$TEAMS_URL" /tmp/teams.json
          check_api_200 "scores" "$SCORES_URL" /tmp/scores.json
