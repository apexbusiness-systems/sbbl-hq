name: Stream Validation Route Patch

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stream-validation-final-main-pass1
    paths:
      - 'ops/validation/apply-contract-route-patch.mjs'
      - 'src/worker/validation-contract-wrapper.ts'
      - '.github/workflows/stream-validation-route-patch.yml'

permissions:
  contents: write

jobs:
  patch-contract-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic contract-route patch
        run: node ops/validation/apply-contract-route-patch.mjs

      - name: Commit patched existing files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json wrangler.jsonc
            git commit -m "chore(stream-validation): wire wrapper entry and validation scripts"
            git push
          else
            echo "No patch changes detected"
          fi
