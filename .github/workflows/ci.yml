name: CI

on:
  push:
    branches: [main, staging, 'release/**']
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time env — fallback public values safe in CI (Supabase RLS protects data)
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YW5pbHh5Z25wdWN3a3dwc29jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI5OTIsImV4cCI6MjA5MDE5ODk5Mn0.kLbwopHDqf33H9flwIbO5XqfPYdi0wMqjeVJC76-Ceo' }}
  VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '' }}
  VITE_APP_NAME: SBBL HQ
  VITE_DEFAULT_LEAGUE: SBBL

jobs:
  # ── Job 1: Lint + Typecheck ────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero-warning policy)
        run: npx eslint . --max-warnings 0

      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck (node/vite config)
        run: npx tsc --noEmit -p tsconfig.node.json
        continue-on-error: true

      # ── Job 2: Unit & Integration Tests + Coverage ────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage --reporter=dot --pool=forks --poolOptions.forks.singleFork=true
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: Build + Bundle Regression Guard ────────────────────────────────
  build:
    name: Build & Bundle Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle regression guard
        shell: bash
        run: |
          set -e
          DIST=dist/assets

          check_chunk() {
            local pattern="$1"
            local limit_kb="$2"
            local chunk_name="$3"
            local file
            file=$(ls "$DIST"/${pattern}-*.js 2>/dev/null | head -1 || true)
            if [ -z "$file" ]; then
              echo "⚠️  $chunk_name chunk not found — may be tree-shaken away (OK)"
              return 0
            fi
            local size_kb
            size_kb=$(( $(wc -c < "$file") / 1024 ))
            if [ "$size_kb" -gt "$limit_kb" ]; then
              echo "❌  $chunk_name: ${size_kb} KB > ${limit_kb} KB limit (file: $file)"
              exit 1
            fi
            echo "✅  $chunk_name: ${size_kb} KB / ${limit_kb} KB"
          }

          check_chunk "react-vendor"    185  "react-vendor"
          check_chunk "supabase-vendor" 215  "supabase-vendor"
          check_chunk "ui-vendor"       700  "ui-vendor"
          check_chunk "charts-vendor"   280  "charts-vendor"
          check_chunk "rxdb-vendor"     600  "rxdb-vendor"
          check_chunk "media-vendor"    360  "media-vendor"
          check_chunk "query-vendor"    80   "query-vendor"
          check_chunk "utils-vendor"    140  "utils-vendor"
          check_chunk "forms-vendor"    80   "forms-vendor"

          total_kb=$(du -sk "$DIST" | cut -f1)
          echo "📦  Total assets: ${total_kb} KB"
          if [ "$total_kb" -gt 8192 ]; then
            echo "⚠️  Total assets exceed 8 MB — review bundle composition"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Job 4: Lighthouse LCP Budget ─────────────────────────────────────────
  lighthouse:
    name: Lighthouse LCP Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14

      - name: Serve build and run Lighthouse
        run: |
          npx vite preview --port 4173 &
          SERVER_PID=$!
          timeout 30 bash -c 'until curl -sf http://localhost:4173/; do sleep 1; done'
          lhci autorun \
            --collect.url=http://localhost:4173/ \
            --collect.numberOfRuns=1 \
            --assert.assertions.largest-contentful-paint="[\"error\",{\"maxNumericValue\":1800}]" \
            --assert.assertions.cumulative-layout-shift="[\"warn\",{\"maxNumericValue\":0.1}]" \
            --assert.assertions.first-contentful-paint="[\"warn\",{\"maxNumericValue\":2500}]" \
            --assert.assertions.total-blocking-time="[\"warn\",{\"maxNumericValue\":300}]" \
            --upload.target=temporary-public-storage
          kill $SERVER_PID || true
        continue-on-error: true

  # ── Job 5: Playwright E2E ─────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
