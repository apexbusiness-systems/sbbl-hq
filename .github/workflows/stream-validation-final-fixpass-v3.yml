name: Stream Validation Final Fixpass V3

on:
  push:
    branches:
      - codex/stream-validation-final-main-pass1
    paths:
      - .github/workflows/stream-validation-final-fixpass-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-fixpass:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply deterministic contract patch pass
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const touched = [];

          function read(rel) {
            return fs.readFileSync(path.join(root, rel), 'utf8');
          }

          function write(rel, content) {
            fs.writeFileSync(path.join(root, rel), content);
            touched.push(rel);
          }

          function replaceChecked(rel, replacer) {
            const before = read(rel);
            const after = replacer(before);
            if (after !== before) write(rel, after);
          }

          replaceChecked('src/worker/bindings.d.ts', (content) => {
            if (content.includes('ENABLE_STREAM_VALIDATION')) return content;
            if (content.includes('  GROQ_API_KEY?: string;')) {
              return content.replace(
                '  GROQ_API_KEY?: string;\n',
                '  GROQ_API_KEY?: string;\n  ENABLE_STREAM_VALIDATION?: string;\n',
              );
            }
            if (content.includes('  ASSETS: { fetch: (req: Request) => Promise<Response> };')) {
              return content.replace(
                '  ASSETS: { fetch: (req: Request) => Promise<Response> };',
                '  ENABLE_STREAM_VALIDATION?: string;\n  ASSETS: { fetch: (req: Request) => Promise<Response> };',
              );
            }
            return content;
          });

          replaceChecked('src/worker/validation-contract-wrapper.ts', (content) => {
            let next = content;
            next = next.replace(
              '  async fetch(req: Request, env: Env, ctx: ExecutionContext): Promise<Response> {',
              '  async fetch(req: Request, env: Env): Promise<Response> {',
            );
            next = next.replaceAll(', env, ctx)', ', env)');
            return next;
          });

          replaceChecked('ops/validation/stream-validation.mjs', (content) => {
            let next = content;
            next = next.replace(
              'function run(command, args) {',
              'function run(command, args, extraEnv = {}) {',
            );
            next = next.replace(
              '    env: { ...process.env },',
              '    env: { ...process.env, ...extraEnv },',
            );
            next = next.replace(
              "  if (targetMode === 'e2e') return run('npx', ['playwright', 'test', 'e2e/stream-validation.spec.ts', '--reporter=json']).ok ? 0 : 1;",
              "  if (targetMode === 'e2e') return run('npx', ['playwright', 'test', 'e2e/stream-validation.spec.ts', '--reporter=json'], {\n    PLAYWRIGHT_PORT: process.env.PLAYWRIGHT_PORT ?? '4174',\n    PLAYWRIGHT_BASE_URL: process.env.PLAYWRIGHT_BASE_URL ?? 'http://127.0.0.1:4174',\n  }).ok ? 0 : 1;",
            );
            next = next.replace(
              "    e2e: run('npx', ['playwright', 'test', 'e2e/stream-validation.spec.ts', '--reporter=json']),",
              "    e2e: run('npx', ['playwright', 'test', 'e2e/stream-validation.spec.ts', '--reporter=json'], {\n      PLAYWRIGHT_PORT: process.env.PLAYWRIGHT_PORT ?? '4174',\n      PLAYWRIGHT_BASE_URL: process.env.PLAYWRIGHT_BASE_URL ?? 'http://127.0.0.1:4174',\n    }),",
            );
            return next;
          });

          replaceChecked('e2e/stream-validation.spec.ts', (content) => {
            if (content.includes('video.muted = true;')) return content;
            return content.replace(
              '    const start = video.currentTime;\n',
              '    video.muted = true;\n    await video.play().catch(() => {});\n    const start = video.currentTime;\n',
            );
          });

          write(
            'ops/validation/apply-prelive-comment-patch.mjs',
            [
              "import { readFileSync, writeFileSync } from 'node:fs';",
              "import { resolve } from 'node:path';",
              '',
              "const workflowPath = resolve(process.cwd(), '.github/workflows/stream-validation-prelive.yml');",
              "let content = readFileSync(workflowPath, 'utf-8');",
              '',
              "if (!content.includes('Post validation verdict comment')) {",
              '  const insertion = [',
              "    '',",
              "    '      - name: Post validation verdict comment',",
              "    \"        if: always() && github.event_name == 'pull_request'\",",
              "    '        uses: actions/github-script@v7',",
              "    '        with:',",
              "    '          script: |',",
              "    \"            const fs = require('fs');\",",
              "    \"            let verdict = 'REJECTED';\",",
              "    '            let failingChecks = [];',",
              "    '            try {',",
              "    \"              const report = JSON.parse(fs.readFileSync('validation-report.json', 'utf-8'));\",",
              "    \"              verdict = report.final_verdict || 'REJECTED';\",",
              "    '              failingChecks = report.failing_checks || [];',",
              "    '            } catch (_err) {',",
              "    \"              failingChecks = ['validation-report.json missing'];\",",
              "    '            }',",
              "    '',",
              "    '            const lines = [',",
              "    \"              'Stream Validation Verdict',\",",
              "    \"              '- final_verdict: ' + verdict,\",",
              "    \"              '- command: node ops/validation/stream-validation.mjs prelive',\",",
              "    '            ];',",
              "    '',",
              "    \"            if (verdict !== 'VERIFIED') {\",",
              "    \"              lines.push('- failing_checks: ' + (failingChecks.join(', ') || 'unknown'));\",",
              "    \"              lines.push('- remediation: resolve failing checks then rerun validate:prelive');\",",
              "    '            }',",
              "    '',",
              "    '            await github.rest.issues.createComment({',",
              "    '              owner: context.repo.owner,',",
              "    '              repo: context.repo.repo,',",
              "    '              issue_number: context.issue.number,',",
              "    \"              body: lines.join('\\\\n'),\",",
              "    '            });',",
              "  ].join('\\\\n');",
              '',
              '  content = content.replace(',
              "    '\\\\n      - name: Upload stream-validation artifacts',",
              "    `${insertion}\\\\n      - name: Upload stream-validation artifacts`,",
              '  );',
              '',
              '  writeFileSync(workflowPath, content);',
              '}',
              '',
            ].join('\n'),
          );

          replaceChecked('.github/workflows/stream-validation-prelive.yml', (content) => {
            if (content.includes('Post validation verdict comment')) return content;
            const block = [
              '',
              '      - name: Post validation verdict comment',
              "        if: always() && github.event_name == 'pull_request'",
              '        uses: actions/github-script@v7',
              '        with:',
              '          script: |',
              "            const fs = require('fs');",
              "            let verdict = 'REJECTED';",
              '            let failingChecks = [];',
              '            try {',
              "              const report = JSON.parse(fs.readFileSync('validation-report.json', 'utf-8'));",
              "              verdict = report.final_verdict || 'REJECTED';",
              '              failingChecks = report.failing_checks || [];',
              '            } catch (_err) {',
              "              failingChecks = ['validation-report.json missing'];",
              '            }',
              '',
              '            const lines = [',
              "              'Stream Validation Verdict',",
              "              '- final_verdict: ' + verdict,",
              "              '- command: node ops/validation/stream-validation.mjs prelive',",
              '            ];',
              '',
              "            if (verdict !== 'VERIFIED') {",
              "              lines.push('- failing_checks: ' + (failingChecks.join(', ') || 'unknown'));",
              "              lines.push('- remediation: resolve failing checks then rerun validate:prelive');",
              '            }',
              '',
              '            await github.rest.issues.createComment({',
              '              owner: context.repo.owner,',
              '              repo: context.repo.repo,',
              '              issue_number: context.issue.number,',
              "              body: lines.join('\\n'),",
              '            });',
            ].join('\n');
            return content.replace('\n      - name: Upload stream-validation artifacts', `${block}\n      - name: Upload stream-validation artifacts`);
          });

          const markerPath = path.join(root, 'ops', 'validation', '.final-fixpass-v3');
          fs.writeFileSync(markerPath, `patched_at=${new Date().toISOString()}\n`);
          touched.push('ops/validation/.final-fixpass-v3');

          if (touched.length === 0) {
            console.log('No patch changes were required.');
          } else {
            console.log('Patched files:');
            for (const file of touched) console.log(`- ${file}`);
          }
          NODE

      - name: Commit deterministic fixpass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/bindings.d.ts \
                  src/worker/validation-contract-wrapper.ts \
                  ops/validation/stream-validation.mjs \
                  e2e/stream-validation.spec.ts \
                  ops/validation/apply-prelive-comment-patch.mjs \
                  .github/workflows/stream-validation-prelive.yml \
                  ops/validation/.final-fixpass-v3
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "fix(stream-validation): final contract-route patch pass"
            git push
          else
            echo "No changes to commit"
          fi
