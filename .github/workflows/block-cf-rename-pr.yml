name: Block Cloudflare Worker Rename PRs

# Cloudflare's bot repeatedly opens PRs on this branch trying to rename
# sbbl-hq-worker → sbbl-hq. This MUST NOT be merged:
#   - sbbl-hq      = Pages project (serves frontend at sbbl-hq.icu)
#   - sbbl-hq-worker = Worker (serves /api/*, /ops/health)
# Merging the rename would create a name conflict on the Cloudflare account
# and break the custom domain binding. wrangler-config-guard.test.ts also
# enforces this invariant with 16 tests.
#
# This workflow auto-closes any PR from the known bot branch and posts
# an explanatory comment so it never consumes CI minutes or human review.

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

jobs:
  block-cf-rename:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    if: github.head_ref == 'update_worker_name_to_sbbl-hq'
    name: Auto-close Cloudflare rename PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ⛔ Auto-closed: Cloudflare Worker rename blocked',
                '',
                'This PR is auto-generated by the Cloudflare Workers & Pages integration.',
                'It attempts to rename `sbbl-hq-worker` → `sbbl-hq` in `wrangler.jsonc`.',
                '',
                '**This change must never be merged.** The two names are intentional:',
                '| Resource | Name | Role |',
                '|---|---|---|',
                '| Cloudflare Pages | `sbbl-hq` | Serves React frontend at sbbl-hq.icu |',
                '| Cloudflare Worker | `sbbl-hq-worker` | Serves `/api/*` and `/ops/health` |',
                '',
                'Renaming the Worker to `sbbl-hq` would conflict with the Pages project name',
                'and break the custom domain binding on `sbbl-hq.icu`.',
                '',
                '`wrangler-config-guard.test.ts` enforces this with 16 dedicated tests.',
                '',
                '_Auto-closed by `.github/workflows/block-cf-rename-pr.yml`_'
              ].join('\n')
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

            core.notice(`Auto-closed PR #${context.issue.number} — Cloudflare rename bot blocked.`);
