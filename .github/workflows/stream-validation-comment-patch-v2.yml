name: Stream Validation Comment Patch V2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stream-validation-final-main-pass1

permissions:
  contents: write

jobs:
  patch-prelive-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply prelive workflow verdict-comment patch
        run: node ops/validation/apply-prelive-comment-patch.mjs

      - name: Commit patched prelive workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .github/workflows/stream-validation-prelive.yml
            git commit -m "chore(stream-validation): post prelive verdict to PR comments"
            git push
          else
            echo "No workflow patch changes detected"
          fi
