name: Stream Validation Runner

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stream-validation-final-main-pass1

permissions:
  contents: write

jobs:
  run-prelive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ezanilxygnpucwkwpsoc.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'REDACTED' }}
      VALIDATION_SOURCE_CLASSIFICATION: sandbox
      VALIDATION_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > .preview.log 2>&1 &
          sleep 8

      - name: Run validate:prelive
        run: node ops/validation/stream-validation.mjs prelive

      - name: Commit verdict artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-report.json verification-matrix.md performance-summary.json audit-summary.json || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "ci(stream-validation): publish latest prelive validation artifacts"
            git push
          else
            echo "No verdict artifact changes detected"
          fi
