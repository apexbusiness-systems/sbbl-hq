name: Stream Validation Force Comment Patch

on:
  workflow_dispatch:
  push:
    branches:
      - codex/stream-validation-final-main-pass1

permissions:
  contents: write

jobs:
  force-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force insert verdict comment step
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/stream-validation-prelive.yml';
          let content = fs.readFileSync(path, 'utf8');
          if (content.includes('Post validation verdict comment')) {
            process.exit(0);
          }
          const block = `
      - name: Post validation verdict comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let verdict = 'REJECTED';
            let failingChecks = [];
            try {
              const report = JSON.parse(fs.readFileSync('validation-report.json', 'utf-8'));
              verdict = report.final_verdict || 'REJECTED';
              failingChecks = report.failing_checks || [];
            } catch (_err) {
              failingChecks = ['validation-report.json missing'];
            }

            const lines = [
              'Stream Validation Verdict',
              '- final_verdict: ' + verdict,
              '- command: node ops/validation/stream-validation.mjs prelive',
            ];

            if (verdict !== 'VERIFIED') {
              lines.push('- failing_checks: ' + (failingChecks.join(', ') || 'unknown'));
              lines.push('- remediation: resolve failing checks then rerun validate:prelive');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\\n'),
            });
`;
          content = content.replace('\n      - name: Upload stream-validation artifacts', block + '\n      - name: Upload stream-validation artifacts');
          fs.writeFileSync(path, content);
          NODE

      - name: Commit prelive workflow patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .github/workflows/stream-validation-prelive.yml
            git commit -m "chore(stream-validation): ensure PR verdict comment from validate:prelive"
            git push
          else
            echo "No forced patch changes detected"
          fi
