name: Selfhost Auth Smoke

# Two-layer regression net:
#
# Layer 1 (cors-static-check) — runs on every PR that touches Kong:
#   Parses the PR's kong.yml and verifies every required header appears
#   in the explicit-allowlist of every auth-v1* route. Catches the
#   "PR drops a header" failure mode at review time, before deploy.
#
# Layer 2 (live-production-probe) — runs nightly + manually:
#   Hits the production endpoint, verifies CORS preflight accepts every
#   header supabase-js v2 currently sends, and verifies POST /auth/v1/token
#   reaches GoTrue. Catches drift between this repo and production.

on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'sbbl-hq-selfhost/volumes/api/kong.yml'
      - '.github/workflows/selfhost-auth-smoke.yml'

jobs:
  cors-static-check:
    name: kong.yml allows all required headers
    # Runs on PRs that touch Kong (and on schedule for belt-and-braces).
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify kong.yml CORS allowlist contains every required header
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib

          required = {
              'accept', 'accept-profile', 'accept-version', 'authorization',
              'cache-control', 'content-length', 'content-md5',
              'content-profile', 'content-type', 'date',
              'if-match', 'if-modified-since', 'if-none-match',
              'prefer', 'range', 'x-requested-with',
              'apikey', 'x-client-info', 'x-supabase-api-version', 'x-upsert',
          }

          path = pathlib.Path('sbbl-hq-selfhost/volumes/api/kong.yml')
          cfg = yaml.safe_load(path.read_text())

          failures = []
          for svc in cfg.get('services', []):
              for plugin in svc.get('plugins', []) or []:
                  if plugin.get('name') != 'cors':
                      continue
                  conf = plugin.get('config') or {}
                  headers = conf.get('headers')
                  if not headers:
                      # No explicit allowlist => Kong mirrors request headers.
                      # That is acceptable; skip.
                      continue
                  allowed = {h.lower() for h in headers}
                  missing = required - allowed
                  if missing:
                      failures.append((svc.get('name', '<unnamed>'), sorted(missing)))

          if failures:
              print('::error::kong.yml CORS allowlist is missing required headers:')
              for name, miss in failures:
                  print(f'  - {name}: missing {miss}')
              print('::error::Add the missing headers to the cors plugin config under each affected route.')
              sys.exit(1)

          print(f'OK — every explicit-allowlist auth route allows all {len(required)} required headers.')
          PY

  live-production-probe:
    name: Probe production CORS + auth reachability
    # Only run on schedule (nightly) and manual dispatch — never on PRs,
    # because the PR is the SOURCE of the change that will eventually
    # update production. Failing a PR because production has not yet
    # adopted the PR's change would be circular.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify OPTIONS preflight allows all required headers
        env:
          SUPABASE_URL: https://supabase.sbbl-hq.icu
          APP_ORIGIN: https://sbbl-hq.icu
          REQUIRED_HEADERS: >-
            accept,accept-profile,accept-version,authorization,cache-control,content-length,content-md5,content-profile,content-type,date,if-match,if-modified-since,if-none-match,prefer,range,x-requested-with,apikey,x-client-info,x-supabase-api-version,x-upsert
        run: |
          set -euo pipefail

          echo "Probing OPTIONS $SUPABASE_URL/auth/v1/token from origin $APP_ORIGIN"
          response_file=$(mktemp)
          headers_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -D "$headers_file" -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: $APP_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: $REQUIRED_HEADERS" \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")

          echo "Preflight HTTP $http_code"
          echo "--- response headers ---"
          cat "$headers_file"
          echo "------------------------"

          if [ "$http_code" != "204" ] && [ "$http_code" != "200" ]; then
            echo "::error::Preflight returned $http_code (expected 204 or 200)."
            exit 1
          fi

          allow=$(grep -i '^access-control-allow-headers:' "$headers_file" | head -n 1 | cut -d ':' -f 2- | tr -d '\r' | tr 'A-Z' 'a-z' | xargs)
          if [ -z "$allow" ]; then
            echo "::error::No Access-Control-Allow-Headers in preflight response."
            exit 1
          fi
          echo "Allowed headers (lowercased): $allow"

          missing=""
          IFS=',' read -ra reqs <<< "$REQUIRED_HEADERS"
          for h in "${reqs[@]}"; do
            h_trim=$(echo "$h" | xargs)
            if ! echo ",$allow," | grep -qi ",$h_trim,"; then
              missing="$missing $h_trim"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Preflight is missing required headers:$missing"
            echo "::error::Production Kong has drifted from volumes/api/kong.yml. Redeploy."
            exit 1
          fi
          echo "All required headers allowed on production."

      - name: Verify POST /auth/v1/token reaches GoTrue (no 5xx)
        env:
          SUPABASE_URL: https://supabase.sbbl-hq.icu
          APP_ORIGIN: https://sbbl-hq.icu
        run: |
          set -euo pipefail

          # Bogus credentials so we expect 400/401/422 (good) not 200.
          # 5xx = Kong or upstream down (bad).
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Origin: $APP_ORIGIN" \
            -H "Content-Type: application/json" \
            -H "apikey: nope" \
            -H "x-supabase-api-version: 2024-01-01" \
            -d '{"email":"smoke-test-nobody@invalid.example","password":"x"}' \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")

          echo "POST /auth/v1/token => $http_code"
          case "$http_code" in
            400|401|422)
              echo "GoTrue is answering through Kong. Healthy."
              ;;
            5*)
              echo "::error::Got $http_code from Kong/GoTrue. Ingress or upstream is down."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP $http_code. Investigate."
              exit 1
              ;;
          esac
