## Docker Compose override: PgBouncer connection pooler (Phase 2)
## Usage: docker compose -f docker-compose.yml -f docker-compose.pgbouncer.yml up -d

services:
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: supabase-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "100"
      RESERVE_POOL_SIZE: "25"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "200"
      LOG_CONNECTIONS: "1"
      LOG_DISCONNECTIONS: "1"
      LOG_POOLER_ERRORS: "1"
      STATS_PERIOD: "60"
      SERVER_TLS_SSLMODE: prefer
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: supabase_default
    external: true
